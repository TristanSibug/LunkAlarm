name: Website checks
on:
  push:
    branches: [main, website/desktop-studio]
    paths: ["web/**", "tests/web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "tests/web/**", ".github/workflows/web.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - run: npm ci --prefix tests/web --ignore-scripts
      - name: Install browser
        working-directory: tests/web
        run: npx playwright install --with-deps chromium
      - name: Check website syntax
        run: |
          node --check web/app.js
          node --check web/studio.js
      - name: Browser regression tests
        run: node tests/web/studio.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Website-previews
          path: artifacts/web-previews/
          if-no-files-found: ignore
