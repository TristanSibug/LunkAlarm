name: Native iOS app
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          xcode_path=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          if [ -z "$xcode_path" ]; then echo "Xcode 26 is required for AlarmKit"; exit 1; fi
          sudo xcode-select -s "$xcode_path/Contents/Developer"
          xcodebuild -version
      - name: Test native scheduling and persistence
        run: swift test --package-path ios
      - name: Check generated project
        run: |
          python3 ios/scripts/generate_project.py
          git diff --exit-code -- ios/LunkAlarm.xcodeproj
      - name: Build iPhone simulator app
        id: simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/LunkAlarm.xcodeproj -scheme LunkAlarm \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath artifacts/ios-build \
            CODE_SIGNING_ALLOWED=NO build | tee ios-build.log
      - name: Build device app without signing
        id: device
        run: |
          set -o pipefail
          xcodebuild -project ios/LunkAlarm.xcodeproj -scheme LunkAlarm \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -configuration Release -derivedDataPath artifacts/ios-device \
            CODE_SIGNING_ALLOWED=NO build | tee ios-device-build.log
      - name: Launch native app and capture simulator screen
        id: launch
        timeout-minutes: 8
        run: |
          set -o pipefail
          {
            device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; phones=[v for runtime,devices in d.items() if "iOS-26" in runtime for v in devices if v["name"].startswith("iPhone")]; phones.sort(key=lambda v:v["state"]!="Booted"); print(phones[0]["udid"])')
            state=$(xcrun simctl list devices --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(v["state"] for devices in d.values() for v in devices if v["udid"]==sys.argv[1]))' "$device_id")
            echo "Simulator $device_id ($state)"
            if [ "$state" != Booted ]; then xcrun simctl boot "$device_id"; fi
            xcrun simctl bootstatus "$device_id" -b
            echo "LUNK_IOS_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
            xcrun simctl install "$device_id" artifacts/ios-build/Build/Products/Debug-iphonesimulator/LunkAlarm.app
            xcrun simctl launch --terminate-running-process "$device_id" online.reeeserve.LunkAlarm
            sleep 3
            xcrun simctl io "$device_id" screenshot artifacts/ios-clock.png
          } 2>&1 | tee ios-launch.log
      - name: Test native gestures, wheels and automatic math entry
        id: uiTests
        timeout-minutes: 8
        run: |
          set -o pipefail
          xcodebuild test -project ios/LunkAlarm.xcodeproj -scheme LunkAlarm \
            -destination "platform=iOS Simulator,id=$LUNK_IOS_SIMULATOR_ID" \
            -configuration Debug -derivedDataPath artifacts/ios-build \
            -resultBundlePath artifacts/ios-ui-tests.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO | tee ios-ui-test.log
      - name: Export native UI previews
        if: always()
        run: |
          if [ -d artifacts/ios-ui-tests.xcresult ]; then
            xcrun xcresulttool export attachments --path artifacts/ios-ui-tests.xcresult --output-path artifacts/ios-ui-previews
          fi
      - name: Report Xcode compiler diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          errors = []
          for filename in ('ios-build.log', 'ios-device-build.log', 'ios-launch.log', 'ios-ui-test.log'):
              path = Path(filename)
              if not path.exists():
                  continue
              for line in path.read_text().splitlines():
                  if 'error:' not in line:
                      continue
                  errors.append(line)
                  match = re.search(r'(/[^:]+):(\d+):(\d+): error: (.*)', line)
                  escape = lambda value: value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  if match:
                      source = os.path.relpath(match[1], os.environ['GITHUB_WORKSPACE'])
                      print(f'::error file={source},line={match[2]},col={match[3]}::{escape(match[4])}')
                  else:
                      print('::error::' + escape(line))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Xcode diagnostics\n\n```text\n' + '\n'.join(errors) + '\n```\n')
          PY
      - name: Package source and unsigned builds
        if: always() && steps.simulator.outcome == 'success' && steps.device.outcome == 'success'
        run: |
          git archive --format=zip --output=LunkAlarm-iOS-source.zip HEAD ios
          ditto -c -k --sequesterRsrc --keepParent artifacts/ios-build/Build/Products/Debug-iphonesimulator/LunkAlarm.app LunkAlarm-iOS-Simulator.zip
          mkdir -p artifacts/unsigned/Payload
          cp -R artifacts/ios-device/Build/Products/Release-iphoneos/LunkAlarm.app artifacts/unsigned/Payload/
          cd artifacts/unsigned
          zip -qr ../../LunkAlarm-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: LunkAlarm-iOS
          path: |
            LunkAlarm-iOS-source.zip
            LunkAlarm-iOS-Simulator.zip
            LunkAlarm-iOS-unsigned.ipa
            artifacts/ios-clock.png
            ios-build.log
            ios-device-build.log
            ios-ui-test.log
            ios-launch.log
            artifacts/ios-ui-previews
            artifacts/ios-ui-tests.xcresult
          if-no-files-found: warn
      - name: Save public build report and preview
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          BUILD_STATUS: ${{ job.status }}
          SIMULATOR_STATUS: ${{ steps.simulator.outcome }}
          DEVICE_STATUS: ${{ steps.device.outcome }}
          LAUNCH_STATUS: ${{ steps.launch.outcome }}
          UI_TEST_STATUS: ${{ steps.uiTests.outcome }}
        run: |
          report_dir="$RUNNER_TEMP/lunkalarm-ios-report"
          if git ls-remote --exit-code --heads origin ios-build-reports >/dev/null; then
            git fetch --depth=1 origin ios-build-reports
            git worktree add --detach "$report_dir" FETCH_HEAD
          else
            git worktree add --detach "$report_dir" HEAD
            git -C "$report_dir" checkout --orphan ios-build-report-local
            git -C "$report_dir" rm -rf .
          fi
          python3 ios/scripts/report_build.py "$report_dir"
          git -C "$report_dir" config user.name 'github-actions[bot]'
          git -C "$report_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$report_dir" add .
          git -C "$report_dir" commit -m "Report native iOS build $GITHUB_RUN_ID"
          git -C "$report_dir" push origin HEAD:refs/heads/ios-build-reports
