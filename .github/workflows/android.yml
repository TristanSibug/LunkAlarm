name: Native Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache development signing identity for installable updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lunkalarm-android-development-keystore-v1
      - name: Prepare SDK and development signing key
        run: |
          mkdir -p ~/.android artifacts
          set -o pipefail
          python3 - <<'PYSDK' 2>&1 | tee artifacts/android-sdk-setup.log
          import os, subprocess
          sdk = os.path.join(os.environ['ANDROID_HOME'], 'cmdline-tools', 'latest', 'bin', 'sdkmanager')
          subprocess.run([sdk, '--version'], check=True)
          subprocess.run([sdk, 'platforms;android-36', 'build-tools;35.0.0'], input='y\n' * 100, text=True, check=True)
          PYSDK
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Build APK, run core tests and Android lint
        id: apk
        run: |
          set -o pipefail
          ./android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --console plain | tee artifacts/android-build.log
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native UI, denied permission, Doze delivery and failed unlock
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none
          script: ./android/scripts/test_on_emulator.sh
      - name: Package and verify installable APK
        if: success()
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/LunkAlarm-Android-1.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs artifacts/LunkAlarm-Android-1.1.0.apk > artifacts/android-signature.txt
          git archive --format=zip --output=artifacts/LunkAlarm-Android-source.zip HEAD android
          cd artifacts
          sha256sum LunkAlarm-Android-1.1.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: LunkAlarm-Android
          path: |
            artifacts/
            android/app/build/outputs/apk/
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
      - name: Save public build report and native previews
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          BUILD_STATUS: ${{ job.status }}
          APK_STATUS: ${{ steps.apk.outcome }}
          EMULATOR_STATUS: ${{ steps.emulator.outcome }}
          RELEASE_STATUS: manual
        run: |
          report_dir="$RUNNER_TEMP/lunkalarm-android-report"
          if git ls-remote --exit-code --heads origin android-build-reports >/dev/null; then
            git fetch --depth=1 origin android-build-reports
            git worktree add --detach "$report_dir" FETCH_HEAD
          else
            git worktree add --detach "$report_dir" HEAD
            git -C "$report_dir" checkout --orphan android-build-report-local
            git -C "$report_dir" rm -rf --quiet .
          fi
          python3 android/scripts/report_build.py "$report_dir"
          git -C "$report_dir" config user.name 'github-actions[bot]'
          git -C "$report_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$report_dir" add .
          git -C "$report_dir" commit -m "Report Android build $GITHUB_RUN_ID"
          git -C "$report_dir" push origin HEAD:refs/heads/android-build-reports
